<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who's Most Likely To? 🥃</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-gold: #ffb700;
      --neon-purple: #7928ca;
      --bg-dark: #0a0612;
      --card-bg: rgba(23, 15, 38, 0.85);
    }

    * { box-sizing: border-box; font-family: 'Outfit', -apple-system, sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
      color: #fff;
      padding: 15px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .header-title {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0 5px 0;
      text-shadow: 0 0 20px rgba(0,243,255,0.3);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      border-radius: 24px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 6, 18, 0.6);
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.3s;
    }

    textarea { height: 110px; text-align: left; font-size: 14px; }

    input:focus, textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      color: #fff;
      box-shadow: 0 8px 25px rgba(255, 0, 127, 0.4);
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--neon-cyan), #0081ff);
      color: #000;
      box-shadow: 0 8px 25px rgba(0, 243, 255, 0.4);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--neon-gold), #ff5500);
      color: #000;
      box-shadow: 0 8px 25px rgba(255, 183, 0, 0.6);
    }

    .btn:active { transform: scale(0.96); }

    /* Powerups Grid */
    .powerup-container {
      display: flex;
      gap: 10px;
      margin: 15px 0 5px 0;
    }

    .powerup-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .powerup-btn.active {
      background: linear-gradient(135deg, var(--neon-gold), #ff5500) !important;
      color: #000 !important;
      border-color: var(--neon-gold) !important;
      box-shadow: 0 0 15px rgba(255, 183, 0, 0.6);
    }

    .powerup-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #444;
    }

    .vote-grid { display: grid; gap: 10px; margin-top: 15px; }

    .vote-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 0, 127, 0.4);
      color: #fff;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vote-btn.selected {
      background: #00b894 !important;
      border-color: #00b894 !important;
      color: #fff !important;
      box-shadow: 0 0 20px rgba(0, 184, 148, 0.6);
    }

    .vote-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #555;
    }

    .room-badge {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .q-tracker {
      color: var(--neon-gold);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .timer-ring {
      font-size: 36px;
      font-weight: 900;
      color: var(--neon-pink);
      margin: 10px 0;
      text-shadow: 0 0 15px var(--neon-pink);
    }

    .question-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin: 10px 0 15px 0;
      color: #fff;
    }

    .host-dashboard {
      background: rgba(0, 243, 255, 0.05);
      border: 1px dashed var(--neon-cyan);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .voters-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .voter-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      color: #aaa;
    }

    .voter-badge.done {
      background: rgba(0, 184, 148, 0.2);
      border: 1px solid #00b894;
      color: #00b894;
    }

    .loser-stage {
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(255, 183, 0, 0.2));
      border: 2px solid var(--neon-gold);
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
      animation: pulseStage 1.5s infinite alternate;
    }

    @keyframes pulseStage {
      from { box-shadow: 0 0 15px rgba(255, 183, 0, 0.2); }
      to { box-shadow: 0 0 30px rgba(255, 183, 0, 0.6); }
    }

    .loser-title {
      color: var(--neon-gold);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .loser-name {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      margin: 5px 0;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      line-height: 1.2;
    }

    .tally-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin: 6px 0;
      font-size: 16px;
      font-weight: 700;
    }

    #qrcode img { margin: 15px auto; border: 6px solid #fff; border-radius: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header-title">Most Likely To 🥃</div>
  <div id="room-display" class="room-badge hidden"></div>

  <!-- ENTRY SCREEN -->
  <div id="entry-screen" class="card">
    <h2 style="margin-top:0">Party Game Studio</h2>
    <input type="text" id="player-name-input" placeholder="Your Name">
    <input type="text" id="join-code-input" placeholder="4-Digit Room Code" maxlength="4">
    <button class="btn btn-cyan" onclick="joinRoom()">Join Game</button>
    <div style="margin: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
    <button class="btn btn-primary" onclick="showHostSetup()">Host New Game</button>
  </div>

  <!-- HOST SETUP SCREEN -->
  <div id="setup-screen" class="card hidden">
    <h2>Host Control Center</h2>
    <input type="text" id="host-name" placeholder="Host Player Name">
    <p style="color: #aaa; margin: 10px 0 0 0; font-size: 13px;">Paste Questions List Below:</p>
    <textarea id="game-questions" placeholder="Paste your questions here..." oninput="updateCount()"></textarea>
    <div id="question-count" style="color: var(--neon-cyan); font-weight: 700; font-size: 14px; margin-bottom: 10px;">0 Questions Detected</div>
    <button class="btn btn-primary" onclick="createRoom()">Launch Game & Show QR</button>
  </div>

  <!-- VOTING SCREEN -->
  <div id="vote-screen" class="card hidden">
    <div id="qr-container" class="hidden">
      <p style="margin: 0; color: #aaa; font-size: 12px;">SCAN TO JOIN STAGE:</p>
      <div id="qrcode"></div>
    </div>
    <div id="q-tracker" class="q-tracker"></div>
    <div id="timer-display" class="timer-ring">READY</div>
    <div id="display-question" class="question-text"></div>

    <!-- HOST STATUS DASHBOARD -->
    <div id="host-tracker" class="host-dashboard hidden">
      <div style="color: var(--neon-cyan); font-size: 13px; font-weight:700;">LIVE VOTER TRACKER:</div>
      <div id="voters-list" class="voters-grid"></div>
    </div>

    <!-- WILDCARD POWERUPS -->
    <div style="color: #aaa; font-size: 12px; font-weight:700;">1-TIME WILDCARDS:</div>
    <div class="powerup-container">
      <button id="shield-btn" class="powerup-btn" onclick="togglePowerup('shield')">🛡️ Shield</button>
      <button id="reverse-btn" class="powerup-btn" onclick="togglePowerup('reverse')">🔄 Uno Reverse</button>
    </div>

    <div id="voting-instruction" style="color: #aaa; font-size: 13px; margin-top:10px;">TAP A NAME TO VOTE:</div>
    <div id="players-list" class="vote-grid"></div>
    
    <!-- HOST CONTROLS -->
    <button id="start-timer-btn" class="btn btn-gold hidden" onclick="startVotingTimer()" style="margin-top:20px;">Start 10s Timer ⏱️</button>
    <button id="results-btn" class="btn btn-cyan hidden" onclick="triggerResults()" style="margin-top:10px;">Reveal Results 📊</button>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="result-screen" class="card hidden">
    <div class="q-tracker">QUESTION RECAP</div>
    <div id="reveal-question-text" class="question-text" style="font-size: 18px; margin-bottom: 15px;"></div>
    <div id="tally-display"></div>
    
    <div class="loser-stage">
      <div id="loser-header" class="loser-title">Takes The Shot 🥃</div>
      <div id="loser-name" class="loser-name"></div>
    </div>

    <button id="next-btn" class="btn btn-primary hidden" onclick="nextQuestion()" style="margin-top:25px;">Next Question ➔</button>
  </div>

  <!-- FINAL LEADERBOARD SCREEN -->
  <div id="leaderboard-screen" class="card hidden">
    <div class="q-tracker">HALL OF FAME 🏆</div>
    <h2 style="color: var(--neon-gold); margin: 5px 0 15px 0;">NIGHT TOTALS</h2>
    <div id="leaderboard-display"></div>
    <button class="btn btn-cyan" onclick="location.reload()" style="margin-top:25px;">Play Again 🔄</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://who-is-the-most-likely-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRoomCode = "";
    let isHost = false;
    let localPlayerName = "";
    let timerInterval = null;

    let shieldUsed = false;
    let reverseUsed = false;

    // Web Audio Synthesizer SFX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, duration, type="sine") {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function sfxTick() { playTone(800, 0.05, "square"); }
    function sfxBuzzer() { playTone(150, 0.4, "sawtooth"); }
    function sfxFanfare() {
      playTone(523.25, 0.15); setTimeout(() => playTone(659.25, 0.15), 150); setTimeout(() => playTone(783.99, 0.3), 300);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');
    if (urlRoom) {
      document.getElementById('join-code-input').value = urlRoom;
    }

    function parseQuestions(rawText) {
      if (!rawText) return [];
      return rawText
        .split(/\r?\n|\r|\? /)
        .map(q => q.trim())
        .map(q => (q.length > 0 && !q.endsWith('?') && !q.endsWith('.')) ? q + '?' : q)
        .filter(q => q.length > 3);
    }

    window.updateCount = function() {
      const raw = document.getElementById("game-questions").value;
      const parsed = parseQuestions(raw);
      document.getElementById("question-count").innerText = `${parsed.length} Questions Detected`;
    };

    window.showHostSetup = function() {
      document.getElementById("entry-screen").classList.add("hidden");
      document.getElementById("setup-screen").classList.remove("hidden");
    };

    window.createRoom = function() {
      const hostName = document.getElementById("host-name").value.trim();
      const rawQuestions = document.getElementById("game-questions").value;
      const questions = parseQuestions(rawQuestions);

      if (!hostName) return alert("Enter your name as host!");
      if (!questions.length) return alert("Paste at least one question!");

      localPlayerName = hostName;
      currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
      isHost = true;

      let grandTotals = {};
      grandTotals[hostName] = 0;

      const roomRef = ref(db, "rooms/" + currentRoomCode);
      set(roomRef, {
        players: [hostName],
        questions: questions,
        currentQIndex: 0,
        roundVotes: {},
        voters: {},
        activePowerups: {},
        grandTotals: grandTotals,
        timer: "READY",
        timerRunning: false,
        status: "voting"
      }).then(() => {
        listenToRoom();
      });
    };

    window.joinRoom = function() {
      const name = document.getElementById("player-name-input").value.trim();
      const code = document.getElementById("join-code-input").value.trim();
      if (!name) return alert("Enter your name to join!");
      if (!code) return alert("Enter a 4-digit room code!");
      
      localPlayerName = name;
      currentRoomCode = code;

      // Add joining player dynamically to the database player list
      onValue(ref(db, `rooms/${code}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) return alert("Room not found!");

        let currentPlayers = data.players || [];
        if (!currentPlayers.includes(name)) {
          currentPlayers.push(name);
          let grandTotals = data.grandTotals || {};
          grandTotals[name] = 0;

          update(ref(db, `rooms/${code}`), { 
            players: currentPlayers,
            grandTotals: grandTotals
          });
        }
        listenToRoom();
      }, { onlyOnce: true });
    };

    window.startVotingTimer = function() {
      if (!isHost) return;
      if (timerInterval) clearInterval(timerInterval);

      let timeLeft = 10;
      update(ref(db, "rooms/" + currentRoomCode), { timer: timeLeft, timerRunning: true });

      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          update(ref(db, "rooms/" + currentRoomCode), { timer: timeLeft });
        } else {
          clearInterval(timerInterval);
          update(ref(db, "rooms/" + currentRoomCode), { timer: "TIME UP", timerRunning: false });
        }
      }, 1000);
    };

    window.togglePowerup = function(type) {
      onValue(ref(db, `rooms/${currentRoomCode}`), (snapshot) => {
        const data = snapshot.val();
        if (!data || data.status !== "voting" || data.timer === "TIME UP") return;

        const currentActive = (data.activePowerups && data.activePowerups[localPlayerName]) ? data.activePowerups[localPlayerName] : null;

        if (type === 'shield') {
          if (shieldUsed && currentActive !== 'shield') return alert("You already used your Shield tonight!");
          const nextState = currentActive === 'shield' ? null : 'shield';
          update(ref(db, `rooms/${currentRoomCode}/activePowerups`), { [localPlayerName]: nextState });
        }

        if (type === 'reverse') {
          if (reverseUsed && currentActive !== 'reverse') return alert("You already used your Uno Reverse tonight!");
          const nextState = currentActive === 'reverse' ? null : 'reverse';
          update(ref(db, `rooms/${currentRoomCode}/activePowerups`), { [localPlayerName]: nextState });
        }
      }, { onlyOnce: true });
    };

    function listenToRoom() {
      const roomRef = ref(db, "rooms/" + currentRoomCode);
      
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return alert("Room not found!");

        document.getElementById("room-display").innerText = "ROOM: " + currentRoomCode;
        document.getElementById("room-display").classList.remove("hidden");
        document.getElementById("entry-screen").classList.add("hidden");
        document.getElementById("setup-screen").classList.add("hidden");

        const totalQ = data.questions.length;
        const currentIdx = data.currentQIndex;
        const currentQuestion = data.questions[currentIdx];

        if (data.status === "voting") {
          document.getElementById("vote-screen").classList.remove("hidden");
          document.getElementById("result-screen").classList.add("hidden");
          document.getElementById("leaderboard-screen").classList.add("hidden");
          
          document.getElementById("q-tracker").innerText = `QUESTION ${currentIdx + 1} OF ${totalQ}`;
          document.getElementById("display-question").innerText = currentQuestion;

          // Sync Timer
          const timerBox = document.getElementById("timer-display");
          const previousVal = timerBox.innerText;
          timerBox.innerText = data.timer;

          if (data.timer !== previousVal) {
            if (typeof data.timer === "number" && data.timer > 0 && data.timer <= 5) sfxTick();
            if (data.timer === "TIME UP") sfxBuzzer();
          }

          // Powerup Buttons state
          const myPowerup = data.activePowerups ? data.activePowerups[localPlayerName] : null;
          const shieldBtn = document.getElementById("shield-btn");
          const reverseBtn = document.getElementById("reverse-btn");

          shieldBtn.className = myPowerup === 'shield' ? "powerup-btn active" : "powerup-btn";
          reverseBtn.className = myPowerup === 'reverse' ? "powerup-btn active" : "powerup-btn";

          if (shieldUsed && myPowerup !== 'shield') shieldBtn.disabled = true;
          if (reverseUsed && myPowerup !== 'reverse') reverseBtn.disabled = true;

          if (isHost) {
            document.getElementById("start-timer-btn").classList.remove("hidden");
            document.getElementById("results-btn").classList.remove("hidden");
            document.getElementById("host-tracker").classList.remove("hidden");

            // Live Voter Tracker
            const votersList = document.getElementById("voters-list");
            votersList.innerHTML = "";
            const currentVoters = data.voters || {};
            const currentPowers = data.activePowerups || {};

            (data.players || []).forEach(p => {
              const hasVoted = currentVoters[p];
              const pPower = currentPowers[p];
              let badgeIcon = hasVoted ? "✓" : "...";
              if (pPower === 'shield') badgeIcon += " 🛡️";
              if (pPower === 'reverse') badgeIcon += " 🔄";

              const badgeClass = hasVoted ? "voter-badge done" : "voter-badge";
              votersList.innerHTML += `<div class="${badgeClass}">${p} ${badgeIcon}</div>`;
            });

            if (document.getElementById("qrcode").innerHTML === "") {
              document.getElementById("qr-container").classList.remove("hidden");
              const joinUrl = window.location.origin + window.location.pathname + "?room=" + currentRoomCode;
              new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 130, height: 130 });
            }
          }

          // Render Voting Buttons (Automatically populates from connected players)
          const list = document.getElementById("players-list");
          list.innerHTML = "";
          const myCurrentChoice = data.voters ? data.voters[localPlayerName] : null;
          const isLocked = data.timer === "TIME UP";

          (data.players || []).forEach(p => {
            const isSelected = myCurrentChoice === p;
            const btnClass = isSelected ? "vote-btn selected" : "vote-btn";
            const btnText = isSelected ? `${p} ✓` : p;
            const disabledAttr = isLocked ? "disabled" : "";
            list.innerHTML += `<button class="${btnClass}" ${disabledAttr} onclick="castVote('${p}')">${btnText}</button>`;
          });
        }

        if (data.status === "results") {
          if (timerInterval) clearInterval(timerInterval);
          document.getElementById("vote-screen").classList.add("hidden");
          document.getElementById("result-screen").classList.remove("hidden");

          document.getElementById("reveal-question-text").innerText = currentQuestion;

          // Record if player consumed wildcard
          const myPowerup = data.activePowerups ? data.activePowerups[localPlayerName] : null;
          if (myPowerup === 'shield') shieldUsed = true;
          if (myPowerup === 'reverse') reverseUsed = true;

          if (isHost) {
            const nextBtn = document.getElementById("next-btn");
            nextBtn.classList.remove("hidden");
            if (currentIdx + 1 >= totalQ) {
              nextBtn.innerText = "See Final Standings 🏆";
            } else {
              nextBtn.innerText = "Next Question ➔";
            }
          }

          let tallyHtml = "";
          let sortedVotes = [];

          for (let p of (data.players || [])) {
            const count = (data.roundVotes && data.roundVotes[p]) ? data.roundVotes[p] : 0;
            const power = (data.activePowerups && data.activePowerups[p]) ? data.activePowerups[p] : null;
            let pIcon = power === 'shield' ? " 🛡️" : power === 'reverse' ? " 🔄" : "";
            
            tallyHtml += `<div class="tally-row"><span>${p}${pIcon}</span><span style="color:var(--neon-cyan)">${count} Votes</span></div>`;
            sortedVotes.push({ player: p, count: count, power: power });
          }

          sortedVotes.sort((a,b) => b.count - a.count);
          document.getElementById("tally-display").innerHTML = tallyHtml;

          const topWinner = sortedVotes[0];

          if (!topWinner || topWinner.count <= 0) {
            document.getElementById("loser-header").innerText = "NO VOTES CAST!";
            document.getElementById("loser-name").innerText = "Nobody Drinks";
          } 
          else if (topWinner.power === 'reverse') {
            document.getElementById("loser-header").innerText = "🔄 UNO REVERSE ACTIVATED! VOTERS DRINK 🥃";
            
            let votersWhoVotedTop = [];
            for (let [voter, target] of Object.entries(data.voters || {})) {
              if (target === topWinner.player) votersWhoVotedTop.push(voter);
            }

            document.getElementById("loser-name").innerText = votersWhoVotedTop.length ? votersWhoVotedTop.join(" & ") : "Voters!";
            sfxFanfare();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          } 
          else if (topWinner.power === 'shield') {
            document.getElementById("loser-header").innerText = "🛡️ SHIELD ACTIVATED! 2ND PLACE TAKES SHOT 🥃";
            const secondPlace = sortedVotes[1] ? sortedVotes[1].player : "Nobody";
            document.getElementById("loser-name").innerText = `${secondPlace} (Shielded: ${topWinner.player})`;
            sfxFanfare();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          } 
          else {
            let losers = sortedVotes.filter(v => v.count === topWinner.count).map(v => v.player);
            if (losers.length > 1) {
              document.getElementById("loser-header").innerText = "IT'S A TIE! BOTH TAKE A SHOT 🥃";
              document.getElementById("loser-name").innerText = losers.join(" & ");
            } else {
              document.getElementById("loser-header").innerText = "Takes The Shot 🥃";
              document.getElementById("loser-name").innerText = losers[0];
            }
            sfxFanfare();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
        }

        if (data.status === "leaderboard") {
          document.getElementById("result-screen").classList.add("hidden");
          document.getElementById("leaderboard-screen").classList.remove("hidden");

          let sorted = Object.entries(data.grandTotals || {}).sort((a,b) => b[1] - a[1]);
          let boardHtml = "";
          sorted.forEach(([player, count], idx) => {
            const medal = idx === 0 ? "🥇 " : idx === 1 ? "🥈 " : idx === 2 ? "🥉 " : "";
            boardHtml += `<div class="tally-row"><span>${medal}${player}</span><span style="color:var(--neon-gold)">${count} Total Shots</span></div>`;
          });
          document.getElementById("leaderboard-display").innerHTML = boardHtml;
          confetti({ particleCount: 200, spread: 100, origin: { y: 0.4 } });
        }
      });
    }

    window.castVote = function(targetName) {
      onValue(ref(db, `rooms/${currentRoomCode}`), (snapshot) => {
        const data = snapshot.val();
        if (!data || data.status !== "voting" || data.timer === "TIME UP") return;

        const previousVote = data.voters ? data.voters[localPlayerName] : null;
        if (previousVote === targetName) return; 

        let newRoundVotes = { ...(data.roundVotes || {}) };
        let newGrandTotals = { ...(data.grandTotals || {}) };

        if (previousVote) {
          newRoundVotes[previousVote] = Math.max(0, (newRoundVotes[previousVote] || 1) - 1);
          newGrandTotals[previousVote] = Math.max(0, (newGrandTotals[previousVote] || 1) - 1);
        }

        newRoundVotes[targetName] = (newRoundVotes[targetName] || 0) + 1;
        newGrandTotals[targetName] = (newGrandTotals[targetName] || 0) + 1;

        update(ref(db, `rooms/${currentRoomCode}/roundVotes`), newRoundVotes);
        update(ref(db, `rooms/${currentRoomCode}/grandTotals`), newGrandTotals);
        update(ref(db, `rooms/${currentRoomCode}/voters`), { [localPlayerName]: targetName });
      }, { onlyOnce: true });
    };

    window.triggerResults = function() {
      if (!isHost) return;
      if (timerInterval) clearInterval(timerInterval);
      update(ref(db, "rooms/" + currentRoomCode), { status: "results" });
    };

    window.nextQuestion = function() {
      if (!isHost) return;

      onValue(ref(db, "rooms/" + currentRoomCode), (snapshot) => {
        const data = snapshot.val();
        const nextIndex = data.currentQIndex + 1;

        if (nextIndex >= data.questions.length) {
          update(ref(db, "rooms/" + currentRoomCode), { status: "leaderboard" });
          return;
        }

        update(ref(db, "rooms/" + currentRoomCode), {
          currentQIndex: nextIndex,
          roundVotes: {},
          voters: {},
          activePowerups: {},
          timer: "READY",
          timerRunning: false,
          status: "voting"
        });
      }, { onlyOnce: true });
    };
  </script>
</body>
