<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Most Likely To 🥃</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --neon: #ff0055; --bg: #0f0c20; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; padding: 20px; text-align: center; }
    h1 { color: var(--neon); text-transform: uppercase; margin-bottom: 5px; }
    .card { background: #1c1836; padding: 20px; border-radius: 16px; margin: 15px 0; border: 1px solid #332d59; }
    input, textarea, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
    input, textarea { background: #2a244d; color: #fff; text-align: center; font-family: inherit; }
    textarea { height: 100px; text-align: left; }
    button { background: var(--neon); color: #fff; font-weight: bold; cursor: pointer; }
    .vote-btn { background: #2a244d; border: 2px solid var(--neon); color: #fff; font-size: 18px; }
    .vote-btn:active { background: var(--neon); }
    .hidden { display: none; }
    .loser-box { background: #ff0055; padding: 20px; border-radius: 12px; font-size: 22px; font-weight: bold; margin-top: 15px; }
    #qrcode img { margin: 15px auto; border: 8px solid white; border-radius: 8px; }
    .room-tag { background: #2a244d; padding: 8px 15px; border-radius: 20px; font-size: 14px; color: #00d2d3; display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Most Likely To 🥃</h1>
  <div id="room-display" class="room-tag hidden"></div>

  <div id="entry-screen" class="card">
    <h3>Join or Host</h3>
    <input type="text" id="join-code-input" placeholder="Enter 4-Digit Room Code" maxlength="4">
    <button onclick="joinRoom()" style="background: #00d2d3; color: #000;">Join Game</button>
    <hr style="border: 0.5px solid #332d59; margin: 20px 0;">
    <button onclick="showHostSetup()">Create New Game (Host)</button>
  </div>

  <div id="setup-screen" class="card hidden">
    <h3>Host Setup</h3>
    <input type="text" id="player-names" placeholder="Player Names (e.g. Sam, Alex, Maya)">
    <p style="color: #aaa; margin: 10px 0 0 0; font-size: 14px;">Enter Questions (One per line):</p>
    <textarea id="game-questions" placeholder="Most likely to lose phone?&#10;Most likely to end up in jail?&#10;Most likely to cry at a movie?"></textarea>
    <button onclick="createRoom()">Start Game & Show QR</button>
  </div>

  <div id="vote-screen" class="card hidden">
    <div id="qr-container" class="hidden">
      <p style="margin: 0; color: #aaa;">Scan to Join Game:</p>
      <div id="qrcode"></div>
    </div>
    <h2 id="display-question"></h2>
    <p style="color: #aaa;">Tap a name to vote:</p>
    <div id="players-list"></div>
    <button id="results-btn" onclick="showResults()" style="margin-top: 20px; background: #00d2d3; color: #000;" class="hidden">Reveal Results (Host Only)</button>
  </div>

  <div id="result-screen" class="card hidden">
    <h2>The Verdict 📊</h2>
    <div id="tally-display"></div>
    <div id="loser-display" class="loser-box"></div>
    <button id="next-btn" onclick="nextQuestion()" style="margin-top:20px; background: #6c5ce7;" class="hidden">Next Question (Host Only)</button>
  </div>
